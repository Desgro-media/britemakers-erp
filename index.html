<link rel="stylesheet" href="assets/css/app.css">
<script>
  /* apply saved theme before first paint (no flash) */
  (function () {
    try {
      var g = function (k, d) { var v = localStorage.getItem('bm.' + k); return v === null ? d : JSON.parse(v); };
      var t = g('theme', 'dark'), r = document.documentElement;
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      r.setAttribute('data-theme', t); r.setAttribute('data-accent', g('accent', 'orange')); r.setAttribute('data-density', g('density', 'cozy'));
    } catch (e) {}
  })();
</script>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    </linearGradient>
  </defs>
</svg>
